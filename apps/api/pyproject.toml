[project]
name = "agenteval-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agenteval-core",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
