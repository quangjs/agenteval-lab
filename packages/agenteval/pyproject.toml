[project]
name = "agenteval-core"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.30,<1",
    "pydantic>=2.11,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
